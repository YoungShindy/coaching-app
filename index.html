    <script>
      // Theme vor dem ersten Paint setzen (kein Aufblitzen). Dunkel ist Standard.
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark' }

      // Startanimation aktiv: Die Seite selbst ist grün (auch hinter Statusleiste und Home-Indikator).
      // sp-hold: Einblendungen der App warten, bis der Durchflug begonnen hat (siehe src/index.css).
      document.documentElement.classList.add('sp-on', 'sp-hold')

    <style>
      /* Startanimation „HLX Together · Healthy & Athletic" (ca. 2,4 s). Steht inline, damit sie sichtbar ist,
         noch bevor das App-Bundle geladen ist. Schrift: Plus Jakarta Sans (OFL), nur die benötigten Zeichen.
         Jedes bewegte Teil ist eine eigene Ebene (eigenes <svg> bzw. <div>), animiert werden nur transform
         und opacity auf diesen Ebenen: Der Grafikchip übernimmt, der App-Start auf dem Hauptthread bremst nicht.
         Ablauf: Hantel (kompakt) → öffnet sich weich, HLX erscheint → Hantel verschwindet, HLX schrumpft
         nach oben zu „HLX TOGETHER" → HEALTHY & ATHLETIC fahren ein → Durchflug in die App. */
      @font-face {
        font-family: "HLX Splash"; font-style: normal; font-weight: 300 800; font-display: block;
        src: url(/splash/hlx-splash.woff2) format("woff2");
      }
      /* Seitenfarbe während der Animation grün, am Ende weich zurück zur App-Farbe */
      html.sp-on { background-color: #075640; }
      html.sp-on.sp-end { background-color: rgb(var(--c-bg)); transition: background-color .3s cubic-bezier(.3, 0, .5, 1) .12s; }
      #splash {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; overflow: hidden;
        color: #fff; cursor: pointer; font-family: "HLX Splash", "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .3s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      #splash.sp-out { opacity: 0; }
      .sp-bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #075640; }
      /* Zeichenfläche 360 x 400 Einheiten; --u = Pixel je Einheit.
         Handy: 94 % der Breite (max. 420 px); iPad/Mac wachsen mit der kürzeren Seite (50 %), bis 720 px;
         bei sehr niedrigen Fenstern begrenzt 120vh die Größe (Flex-Zentrierung lässt den leeren Rand oben/unten überstehen).
         Dieselbe Formel steht in scripts/generate-splash.cjs. */
      .sp-art { --w: min(94vw, max(420px, 50vmin), 720px, 120vh); --u: calc(var(--w) / 360); position: relative; flex: none; width: var(--w); height: calc(var(--w) * 400 / 360); }
      .sp-cam { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 50% 50%; animation: sp-push 2.1s cubic-bezier(.25, .1, .25, 1) both; }
      .sp-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; overflow: visible; }
      .sp-layer path { fill: #fff; fill-rule: evenodd; }

      /* Hantel: Hälften fahren aus der kompakten Stellung auseinander, später seitlich aus dem Bild */
      .sp-left { animation: sp-open-l .5s cubic-bezier(.76, 0, .18, 1) .2s both, sp-exit-l .35s cubic-bezier(.5, 0, .8, .4) 1s forwards; }
      .sp-right { animation: sp-open-r .5s cubic-bezier(.76, 0, .18, 1) .2s both, sp-exit-r .35s cubic-bezier(.5, 0, .8, .4) 1s forwards; }
      /* HLX: erscheint in der Lücke, wandert dann nach oben und schrumpft zur kleinen Marke */
      .sp-lmove { position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform-origin: 0 0; animation: sp-letters-move .48s cubic-bezier(.25, .8, .25, 1) 1.12s both; }
      .sp-letters { transform-origin: 52.12% 49.81%; animation: sp-letters-in .4s cubic-bezier(.16, 1, .3, 1) .46s both; }
      .sp-tgl { animation: sp-tg-in .4s cubic-bezier(.16, 1, .3, 1) 1.45s both; }
      .sp-tg { font-size: 14px; font-weight: 600; letter-spacing: .4em; fill: #fff; }
      .sp-mask { position: absolute; left: 0; width: 100%; overflow: hidden; }
      .m1 { top: 28%; height: 19%; }
      .m2 { top: 59%; height: 18%; }
      .sp-word { display: block; width: 100%; height: 100%; animation: sp-rise .62s cubic-bezier(.16, 1, .3, 1) both; }
      .w1 { animation-delay: 1.28s; }
      .w2 { animation-delay: 1.4s; }
      .sp-hero { font-size: 74px; font-weight: 700; fill: #fff; }
      .sp-ampl { animation: sp-fade-amp .35s ease-out 1.55s both; }
      .sp-amp { font-size: 30px; font-weight: 600; fill: #fff; }

      /* Durchflug: Buchstaben wachsen auf den Betrachter zu, lösen sich auf, dahinter ist die App.
         Ab ca. 8-fach sind sie unsichtbar, deshalb endet die Skalierung bei 10,5 (spart Grafikspeicher in Safari). */
      .sp-leaving .sp-art { animation: sp-fly .42s linear forwards; will-change: transform, opacity; }
      .sp-leaving .sp-bg { animation: sp-bgout .42s cubic-bezier(.3, 0, .5, 1) forwards; }
      /* Nur der Inhalt setzt sich, nicht #root: Ein Transform auf #root würde die fixierte Tab-Bar mitnehmen */
      html.sp-reveal #root main { animation: sp-settle .42s cubic-bezier(.2, .7, .2, 1) both; }

      @keyframes sp-push { from { transform: scale(.94) } to { transform: scale(1) } }
      @keyframes sp-open-l { from { transform: translateX(calc(var(--u) * 74.11)) } to { transform: none } }
      @keyframes sp-open-r { from { transform: translateX(calc(var(--u) * -74.11)) } to { transform: none } }
      @keyframes sp-exit-l { from { transform: none; opacity: 1 } to { transform: translateX(calc(var(--u) * -54.9)); opacity: 0 } }
      @keyframes sp-exit-r { from { transform: none; opacity: 1 } to { transform: translateX(calc(var(--u) * 54.9)); opacity: 0 } }
      @keyframes sp-letters-in { from { opacity: 0; transform: scaleX(.7) } to { opacity: 1; transform: none } }
      @keyframes sp-letters-move { from { transform: none } to { transform: translate(calc(var(--u) * 79.26), calc(var(--u) * 28.05)) scale(0.2131) } }
      @keyframes sp-tg-in { from { opacity: 0; transform: translateX(calc(var(--u) * -8)) } to { opacity: 1; transform: none } }
      @keyframes sp-rise { from { transform: translateY(calc(var(--u) * 100)) } to { transform: none } }
      @keyframes sp-fade-amp { from { opacity: 0 } to { opacity: .55 } }
      @keyframes sp-fly {
        0% { transform: scale(1.000); opacity: 1 }
        10% { transform: scale(1.075); opacity: 1 }
        20% { transform: scale(1.246); opacity: 1 }
        30% { transform: scale(1.524); opacity: 1 }
        40% { transform: scale(1.949); opacity: 0.88 }
        50% { transform: scale(2.595); opacity: 0.62 }
        60% { transform: scale(3.584); opacity: 0.36 }
        70% { transform: scale(5.122); opacity: 0.15 }
        80% { transform: scale(7.558); opacity: 0.04 }
        90% { transform: scale(9.000); opacity: 0 }
        100% { transform: scale(10.500); opacity: 0 }
      }
      @keyframes sp-bgout { 0%, 28% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes sp-settle { from { transform: scale(1.06) } to { transform: none } }
      /* „Bewegung reduzieren": ruhiges Endbild, danach nur Ausblenden (Opacity-Übergang von #splash bleibt) */
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash * { transition: none !important; }
        html.sp-on.sp-end { transition: background-color .3s ease; }
        .sp-left, .sp-right { opacity: 0; }
        .sp-lmove { transform: translate(calc(var(--u) * 79.26), calc(var(--u) * 28.05)) scale(0.2131); }
        .sp-ampl { opacity: .55; }
      }
      /* Windows-Kontrastdesign: Grün und Weiß der Animation beibehalten (sonst weiß auf weiß) */
      @media (forced-colors: active) {
        #splash, #splash * { forced-color-adjust: none; }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>

    <script>
      // Ablauf: ca. 1,9 s Animation (0,7 s bei „Bewegung reduzieren"), dann Durchflug in die App (0,42 s),
      // sobald diese bereit ist. Tippen/Enter/Leertaste/Esc springt direkt zum Durchflug. Notausgang nach 8 s.
      // Die App läuft schon darunter, ist bis zum Durchflug aber weder per Tastatur noch per Screenreader erreichbar (inert).
      (function () {
        var el = document.getElementById('splash')
        var app = document.getElementById('root')
        var root = document.documentElement
        function release() {
          // Die App darf sich jetzt aufbauen (CSS-Einblendungen und Zahlen-Zählen starten)
          root.classList.remove('sp-hold')
          if (!window.__hlxRevealed) { window.__hlxRevealed = true; window.dispatchEvent(new Event('app-reveal')) }
        }
        if (!el) { root.classList.remove('sp-on'); release(); return }
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var minDone = false, ready = !!window.__hlxReady, started = false, gone = false
        if (app) app.setAttribute('inert', '')
        function remove() {
          if (gone) return
          gone = true
          document.removeEventListener('keydown', onKey)
          root.classList.remove('sp-reveal', 'sp-end', 'sp-on')
          release()
          if (el.parentNode) el.parentNode.removeChild(el)
        }
        function reveal() {
          if (started) return
          started = true
          if (app) app.removeAttribute('inert')
          root.classList.add('sp-end')
          if (reduce) { el.classList.add('sp-out'); release(); setTimeout(remove, 350); return }
          root.classList.add('sp-reveal')
          el.classList.add('sp-leaving')
          setTimeout(release, 140) // die grüne Fläche löst sich ab ca. 0,12 s auf: dann beginnt der Aufbau
          setTimeout(remove, 440)
        }
        function check() { if (minDone && ready) reveal() }
        function skip() { minDone = true; check() }
        function onKey(e) {
          if (started || (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Escape')) return
          e.preventDefault()
          skip()
        }
        setTimeout(skip, reduce ? 700 : 1900)
        setTimeout(reveal, 8000)
        window.addEventListener('app-ready', function () { ready = true; check() })
        el.addEventListener('pointerdown', skip)
        document.addEventListener('keydown', onKey)
      })()
    </script>
