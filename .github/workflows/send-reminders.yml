name: Send Push Reminders

on:
  schedule:
    - cron: '*/15 * * * *'  # alle 15 Minuten (UTC). Die Funktion rechnet pro Nutzer in dessen Ortszeit.
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # Eine Funktion entscheidet je Nutzer: Termin-Erinnerungen, Abend-Erinnerung, Lob, Serien und Wasser (max. 3 pro Tag)
      - name: Send reminders
        run: |
          curl -fsS -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
